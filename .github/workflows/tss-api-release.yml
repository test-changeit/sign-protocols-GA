name: Release TSS API

on:
  push:
    tags:
      - tss-api-*

jobs:
  build:
    name: Build tss-api
    permissions: write-all
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.OS_LIST || '["macos-latest", "ubuntu-latest", "windows-latest"]') }}
        arch: ${{ fromJSON(vars.ARCH_LIST || '["amd64"]') }}
        go: [1.18.0]
        include:
          - os: macos-latest
            platform: macOS
            goos: darwin
          - os: ubuntu-latest
            platform: linux
            goos: linux
          - os: windows-latest
            platform: windows
            extension: '.exe'
            goos: windows
    defaults:
      run:
        shell: bash
        working-directory: ./services/tss-api

    steps:
      - name: Checkout Current Branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup GoLang
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: './services/tss-api/go.sum'

      - name: Run build and prepare target files
        id: build-version
        run: |
          match_version=$(echo "${{ github.ref_name }}" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')
          echo "appVersion=${match_version}" >> $GITHUB_OUTPUT
          
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.arch }} go build -trimpath -o bin/rosenTss-${{ matrix.platform }}-${{ matrix.arch }}-${match_version}${{ matrix.extension }}
          mkdir conf
          mv conf.env.sample conf/conf.env

      - name: Prepare Release File
        run: |
          7z a rosenTss-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.build-version.outputs.appVersion }}.zip ./bin/rosenTss-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.build-version.outputs.appVersion }}${{ matrix.extension }} ./conf

      - name: Upload Release File
        uses: softprops/action-gh-release@v3
        with:
          files: ./services/tss-api/rosenTss*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
